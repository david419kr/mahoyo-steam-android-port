plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

def uiAssetFile = new File(rootProject.projectDir.parentFile, 'data/ui-text.json')
def uiAssetsDirectory = layout.buildDirectory.dir('generated/uiAssets')
def generateUiAssets = tasks.register('generateUiAssets') {
    inputs.file uiAssetFile
    outputs.dir uiAssetsDirectory
    doLast { project.copy { from uiAssetFile; into uiAssetsDirectory } }
}

def stagedProfile = layout.buildDirectory.dir('generated/installedProfileAssets')
def stageRuntimeProfile = tasks.register('stageRuntimeProfile', Sync) {
    from(layout.buildDirectory.dir('generated/dialogueAssets/steam-profile')) {
        exclude 'window-atlas-*.png', 'color*-rgb.bin', 'language-messages.tsv'
    }
    into(stagedProfile.map { it.dir('steam-profile') })
}

android {
    namespace 'org.mahoyo.port'
    compileSdk 35
    ndkVersion '29.0.13113456'
    defaultConfig {
        applicationId 'org.mahoyo.port.unofficial'
        minSdk 28
        targetSdk 35
        testInstrumentationRunner 'org.mahoyo.port.SourceProbe'
        versionCode 88
        versionName '0.6.3'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    testBuildType "release"
    signingConfigs {
        localRelease {
            storeFile file(System.getenv('WOH_KEYSTORE') ?: rootProject.projectDir.parentFile.absolutePath + '/.local/signing/port-release.jks')
            storePassword System.getenv('WOH_STORE_PASSWORD') ?: 'local-port'
            keyAlias 'woh-port'
            keyPassword System.getenv('WOH_KEY_PASSWORD') ?: 'local-port'
        }
    }
    buildTypes {
        release { debuggable false; minifyEnabled false; signingConfig signingConfigs.localRelease }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    kotlinOptions { jvmTarget = "17" }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir(uiAssetsDirectory)
    sourceSets.main.assets.srcDir(stagedProfile)
}

tasks.named('preBuild').configure { dependsOn generateUiAssets; dependsOn stageRuntimeProfile }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
    implementation 'io.github.joshuatam:javasteam:1.8.0.1-26-SNAPSHOT'
    implementation 'io.github.joshuatam:javasteam-depotdownloader:1.8.0.1-26-SNAPSHOT'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.squareup.okhttp3:okhttp:5.1.0'
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.github.luben:zstd-jni:1.5.7-4@aar'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
