plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

def uiAssetFile = new File(rootProject.projectDir.parentFile, 'data/ui-text.json')
def uiAssetsDirectory = layout.buildDirectory.dir('generated/uiAssets')
def generateUiAssets = tasks.register('generateUiAssets') {
    inputs.file uiAssetFile
    outputs.dir uiAssetsDirectory
    doLast { project.copy { from uiAssetFile; into uiAssetsDirectory } }
}

def stagedProfile = layout.buildDirectory.dir('generated/installedProfileAssets')
def stageRuntimeProfile = tasks.register('stageRuntimeProfile', Sync) {
    from(new File(rootProject.projectDir.parentFile, 'data')) {
        include 'steam11-source-profile.json'
        rename 'steam11-source-profile.json', 'source-profile.json'
    }
    into(stagedProfile.map { it.dir('steam-profile') })
}

def projectRoot = rootProject.projectDir.parentFile
def licenseAssets = layout.buildDirectory.dir('generated/licenseAssets')
def stageLicenseAssets = tasks.register('stageLicenseAssets', Sync) {
    inputs.files(providers.provider { configurations.getByName('releaseRuntimeClasspath') })
    inputs.files(providers.provider { configurations.getByName('coreLibraryDesugaring') })
    inputs.files(new File(projectRoot, 'LICENSE'), new File(projectRoot, 'THIRD_PARTY_NOTICES.md'))
    inputs.dir(new File(projectRoot, 'licenses'))
    from(new File(projectRoot, 'licenses/runtime')) { into 'licenses/runtime' }
    from(new File(projectRoot, 'licenses/runtime-components.json')) { into 'licenses' }
    from(new File(projectRoot, 'licenses/DESUGAR_SOURCE.md')) { into 'licenses' }
    from(new File(projectRoot, 'LICENSE'))
    from(new File(projectRoot, 'THIRD_PARTY_NOTICES.md'))
    into licenseAssets
    doFirst {
        def inventory = new groovy.json.JsonSlurper().parse(new File(projectRoot, 'licenses/runtime-components.json'))
        def actual = ['releaseRuntimeClasspath', 'coreLibraryDesugaring'].collectMany { name ->
            configurations.getByName(name).resolvedConfiguration.resolvedArtifacts.collect { a -> [coordinate:a.moduleVersion.id.toString(), configuration:name] }
        }.collect { it.configuration + ':' + it.coordinate }.toSet()
        def declared = inventory.components.collect { it.configuration + ':' + it.coordinate }.toSet()
        if (actual != declared) throw new GradleException("Update third-party license inventory: missing=${actual - declared}, obsolete=${declared - actual}")
        (inventory.components + inventory.native + inventory.data).each { component ->
            if (!component.license || !component.notices) throw new GradleException('Missing third-party license declaration')
            component.notices.each { name ->
                def file = new File(projectRoot, 'licenses/' + name)
                if (!file.isFile() || !file.length()) throw new GradleException('Missing license notice: ' + name)
            }
        }
    }
}

android {
    namespace 'org.mahoyo.port'
    compileSdk 35
    ndkVersion '29.0.13113456'
    defaultConfig {
        applicationId 'org.mahoyo.port.unofficial'
        minSdk 28
        targetSdk 35
        testInstrumentationRunner 'org.mahoyo.port.SourceProbe'
        versionCode 105
        versionName '0.6.12-test'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    testBuildType "release"
    signingConfigs {
        localRelease {
            storeFile file(System.getenv('WOH_KEYSTORE') ?: rootProject.projectDir.parentFile.absolutePath + '/.local/signing/port-release.jks')
            storePassword System.getenv('WOH_STORE_PASSWORD') ?: 'local-port'
            keyAlias 'woh-port'
            keyPassword System.getenv('WOH_KEY_PASSWORD') ?: 'local-port'
        }
    }
    buildTypes {
        release { debuggable false; minifyEnabled false; signingConfig signingConfigs.localRelease }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    kotlinOptions { jvmTarget = "17" }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir(uiAssetsDirectory)
    sourceSets.main.assets.srcDir(stagedProfile)
    sourceSets.main.assets.srcDir(licenseAssets)
}

tasks.named('preBuild').configure { dependsOn generateUiAssets; dependsOn stageRuntimeProfile; dependsOn stageLicenseAssets }

dependencies {
    implementation 'io.github.icedland.iced:iced-x86:1.21.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
    implementation 'io.github.joshuatam:javasteam:1.8.0.1-26-SNAPSHOT'
    implementation 'io.github.joshuatam:javasteam-depotdownloader:1.8.0.1-26-SNAPSHOT'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.squareup.okhttp3:okhttp:5.1.0'
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.github.luben:zstd-jni:1.5.7-4@aar'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
